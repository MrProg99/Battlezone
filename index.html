<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050807">
  <title>Battlezone — Prototype</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell">
    <canvas id="game" aria-label="Prototype de jeu de tank rétro en 3D"></canvas>

    <section class="start-screen" id="start-screen" aria-labelledby="game-title">
      <div class="eyebrow">SYSTÈME TACTIQUE // SECTEUR 07</div>
      <h1 id="game-title">BATTLE<span>ZONE</span></h1>
      <p class="tagline">Prototype d’assaut vectoriel</p>

      <div class="controls">
        <div><kbd>W</kbd><kbd>S</kbd><span>Avancer / reculer</span></div>
        <div><kbd>A</kbd><kbd>D</kbd><span>Tourner le tank</span></div>
        <div><kbd>SOURIS</kbd><span>Orienter la tourelle</span></div>
        <div><kbd>CLIC</kbd><span>Tirer</span></div>
        <div class="recenter-control"><kbd>C</kbd><span>Recentrer la tourelle</span></div>
      </div>

      <button id="start-button" type="button">
        <span>Lancer la mission</span>
        <small>Cliquer pour verrouiller la souris</small>
      </button>
      <p class="hint">ÉCHAP pour libérer la souris · P pour mettre en pause</p>
    </section>

    <section class="message-panel hidden" id="message-panel" aria-live="polite">
      <p class="message-kicker" id="message-kicker">TRANSMISSION</p>
      <h2 id="message-title">MISSION TERMINÉE</h2>
      <p id="message-copy"></p>
      <button id="restart-button" type="button">Nouvelle mission <small>R</small></button>
    </section>

    <div class="pause-label hidden" id="pause-label">PAUSE</div>
    <div class="crt-overlay" aria-hidden="true"></div>
  </main>

  <script src="game.js"></script>
</body>
</html>
